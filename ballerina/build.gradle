import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.process.ExecOperations

import javax.inject.Inject

abstract class BallerinaExecHelper {
    @Inject abstract ExecOperations getExecOperations()
}

plugins {
    id 'io.ballerina.plugin'
}

description = 'Ballerina - Moesif Extension - Ballerina Module'

configurations {
    nativeJar {
        transitive = false
    }
    externalJars {
        transitive = false
    }
}

dependencies {
    nativeJar project(':moesif-extension-native')

    // NOTE: opentelemetry-api, opentelemetry-context, and opentelemetry-common are NOT packed:
    // ballerina-rt shades these artifacts and its copies always win classloading.
    externalJars "io.opentelemetry:opentelemetry-sdk-common:${openTelemetrySDKVersion}"
    externalJars "io.opentelemetry:opentelemetry-sdk-trace:${openTelemetrySDKVersion}"
    externalJars "io.opentelemetry:opentelemetry-exporter-otlp:${openTelemetryExporterVersion}"
    externalJars "io.opentelemetry:opentelemetry-exporter-otlp-common:${openTelemetryExporterVersion}"
    externalJars "io.opentelemetry:opentelemetry-exporter-common:${openTelemetryExporterVersion}"
    externalJars "io.opentelemetry:opentelemetry-exporter-sender-okhttp:${openTelemetryExporterVersion}"
    externalJars "io.opentelemetry:opentelemetry-extension-trace-propagators:${openTelemetryVersion}"
    externalJars "com.squareup.okhttp3:okhttp-jvm:${okhttpVersion}"
    externalJars "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}"
    externalJars "com.squareup.okio:okio-jvm:${okioVersion}"
    externalJars "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    externalJars "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    externalJars "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
}

clean {
    delete "${project.projectDir}/build"
}

task copyExternalJarsToLib(type: Copy) {
    into "${project.projectDir}/lib"
    from configurations.externalJars
}

def packageOrg = "ballerinax"
def packageName = "moesif"
def ballerinaTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/Ballerina.toml")
def ballerinaTomlFile = new File("$project.projectDir/Ballerina.toml")

def tomlVersion = stripBallerinaExtensionVersion("${project.version}")

def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-');
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", "")
    }
}

task updateTomlFiles {
    // Resolve project properties at configuration time: accessing Task.project
    // during execution is deprecated and fails in Gradle 10.
    def projectVersion = project.version.toString()
    def openTelemetryVersion = project.openTelemetryVersion
    def openTelemetrySDKVersion = project.openTelemetrySDKVersion
    def openTelemetryExporterVersion = project.openTelemetryExporterVersion
    def okhttpVersion = project.okhttpVersion
    def kotlinVersion = project.kotlinVersion
    def okioVersion = project.okioVersion
    def ballerinaLangVersion = project.ballerinaLangVersion
    def jacksonVersion = project.jacksonVersion

    doLast {
        def newConfig = ballerinaTomlFilePlaceHolder.text.replace("@project.version@", projectVersion)
        newConfig = newConfig.replace("@toml.version@", tomlVersion)
        newConfig = newConfig.replace("@opentelemetry.version@", openTelemetryVersion)
        newConfig = newConfig.replace("@opentelemetrySDK.version@", openTelemetrySDKVersion)
        newConfig = newConfig.replace("@opentelemetryExporter.version@", openTelemetryExporterVersion)
        newConfig = newConfig.replace("@okhttp.version@", okhttpVersion)
        newConfig = newConfig.replace("@kotlin.version@", kotlinVersion)
        newConfig = newConfig.replace("@okio.version@", okioVersion)
        newConfig = newConfig.replace("@ballerina.version@", ballerinaLangVersion)
        newConfig = newConfig.replace("@jackson.version@", jacksonVersion)
        ballerinaTomlFile.text = newConfig
    }
}

ballerina {
    packageOrganization = packageOrg
    module = packageName
    langVersion = ballerinaLangVersion
    connector = true
    platform = 'java25'
}

task commitTomlFiles {
    def execHelper = project.objects.newInstance(BallerinaExecHelper)
    doLast {
        execHelper.execOperations.exec {
            ignoreExitValue true
            if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                commandLine 'cmd', '/c', "git commit -m \"[Automated] Update the native jar versions\" Ballerina.toml Dependencies.toml"
            } else {
                commandLine 'sh', '-c', "git commit -m '[Automated] Update the native jar versions' Ballerina.toml Dependencies.toml"
            }
        }
    }
}

updateTomlFiles.dependsOn copyStdlibs

build.dependsOn ":moesif-extension-native:build"
test.dependsOn ":moesif-extension-native:build"
build.dependsOn updateTomlFiles
test.dependsOn updateTomlFiles

publishToMavenLocal.dependsOn build
publish.dependsOn build
